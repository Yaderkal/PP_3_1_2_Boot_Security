<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 { color: #333; margin-bottom: 20px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e0e0e0; }
        th { background: #667eea; color: white; }
        tr:hover { background: #f5f5f5; }
        .btn {
            display: inline-block;
            padding: 8px 16px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            margin: 2px;
            transition: all 0.3s;
        }
        .btn:hover { background: #5566d6; transform: translateY(-2px); }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #c82333; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5a6268; }
        .btn-create { background: #28a745; }
        .btn-create:hover { background: #218838; }
        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .roles { display: flex; flex-wrap: wrap; gap: 4px; }
        .role-badge {
            background: #e7f1ff;
            color: #0d6efd;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="toolbar">
        <h1>Админ-панель</h1>
        <a th:href="@{/admin/new}" class="btn btn-create">+ Создать пользователя</a>
    </div>

    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Отчество</th>
            <th>Фамилия</th>
            <th>Email</th>
            <th>Роли</th>
            <th>Действия</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${users}">
            <td th:text="${u.id}">1</td>
            <td th:text="${u.name}">Иван</td>
            <td th:text="${u.middleName}">Иванович</td>
            <td th:text="${u.surName}">Иванов</td>
            <td th:text="${u.mail}">ivan@mail.ru</td>
            <td>
                <div class="roles">
                    <span class="role-badge" th:each="r : ${u.roles}" th:text="${r.name}">ROLE_USER</span>
                </div>
            </td>
            <td>
                <a th:href="@{/admin/edit(id=${u.id})}" class="btn btn-secondary">✏️</a>
                <form th:action="@{/admin/delete}" method="post" style="display:inline">
                    <input type="hidden" name="id" th:value="${u.id}"/>
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Удалить пользователя?')">🗑</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(users)}">
            <td colspan="7" style="text-align:center; color:#888;">Пользователей пока нет</td>
        </tr>
        </tbody>
    </table>
</div>
<div th:replace="logout :: logoutBar"></div>
</body>
</html>
