<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        .admin-layout { min-height: 100vh; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3 admin-layout">
    <div class="row g-3 h-100">

        <aside class="col-md-3 col-lg-2 d-flex">
            <div class="card shadow-sm w-100 d-flex flex-column">
                <div class="list-group list-group-flush flex-grow-1">
                    <a th:href="@{/admin}" class="list-group-item list-group-item-action active">Admin</a>
                    <a th:href="@{/user}"  class="list-group-item list-group-item-action">User</a>
                </div>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <h1 class="h3 mb-0">Панель администратора</h1>
                <button type="button" class="btn btn-success" id="btnCreate">+ Создать пользователя</button>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Отчество</th>
                            <th>Фамилия</th>
                            <th>Email</th>
                            <th>Роли</th>
                            <th class="text-end">Действия</th>
                        </tr>
                        </thead>
                        <tbody id="usersTbody">
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="message" class="mt-3"></div>
        </main>
    </div>
</div>

<div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form id="userForm">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalTitle">Создание пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="f-id"/>

                    <div class="mb-3">
                        <label for="f-name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="f-name" required/>
                    </div>
                    <div class="mb-3">
                        <label for="f-middle" class="form-label">Отчество</label>
                        <input type="text" class="form-control" id="f-middle"/>
                    </div>
                    <div class="mb-3">
                        <label for="f-sur" class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="f-sur"/>
                    </div>
                    <div class="mb-3">
                        <label for="f-mail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="f-mail" required/>
                    </div>
                    <div class="mb-3">
                        <label for="f-pass" class="form-label">
                            Пароль <span id="passHint" class="text-muted small">(обязателен при создании)</span>
                        </label>
                        <input type="password" class="form-control" id="f-pass"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Роли</label>
                        <div id="rolesContainer" class="d-flex flex-wrap gap-3"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary" id="btnSave">Сохранить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-danger text-white">
                <h5 class="modal-title">Удаление пользователя</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p class="mb-3">Вы собираетесь удалить пользователя. Проверьте данные:</p>
                <table class="table table-sm table-bordered align-middle mb-0">
                    <tbody>
                    <tr><th class="w-25 bg-light">ID</th><td id="d-id-cell"></td></tr>
                    <tr><th class="bg-light">Имя</th><td id="d-name-cell"></td></tr>
                    <tr><th class="bg-light">Отчество</th><td id="d-middle-cell"></td></tr>
                    <tr><th class="bg-light">Фамилия</th><td id="d-sur-cell"></td></tr>
                    <tr><th class="bg-light">Email</th><td id="d-mail-cell"></td></tr>
                    <tr><th class="bg-light">Роли</th><td id="d-roles-cell"></td></tr>
                    </tbody>
                </table>
                <p class="text-danger small mt-3 mb-0">⚠️ Действие необратимо.</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="button" class="btn btn-danger" id="btnConfirmDelete">Удалить</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allRoles = [];
    let users = [];
    let editingId = null;
    let deletingId = null;

    const userModal   = new bootstrap.Modal(document.getElementById('userModal'));
    const deleteModal = new bootstrap.Modal(document.getElementById('deleteModal'));

    function showMessage(text, type = 'danger') {
        document.getElementById('message').innerHTML =
            `<div class="alert alert-${type} mb-0">${text}</div>`;
    }
    function clearMessage() {
        document.getElementById('message').innerHTML = '';
    }
    function roleName(name) {
        return name.replace('ROLE_', '');
    }

    async function loadRoles() {
        const res = await fetch('/admin/api/roles');
        if (!res.ok) throw new Error('Не удалось загрузить роли');
        allRoles = await res.json();
    }

    async function loadUsers() {
        const res = await fetch('/admin/api/users');
        if (!res.ok) throw new Error('Не удалось загрузить пользователей');
        users = await res.json();
        renderUsers();
    }

    function renderUsers() {
        const tbody = document.getElementById('usersTbody');

        if (!users.length) {
            tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-4">Пользователей пока нет</td></tr>`;
            return;
        }

        tbody.innerHTML = users.map(u => `
            <tr>
                <td>${u.id}</td>
                <td>${u.name ?? ''}</td>
                <td>${u.middleName ?? ''}</td>
                <td>${u.surName ?? ''}</td>
                <td>${u.mail}</td>
                <td>${u.roles.map(r => `<span class="badge bg-info text-dark me-1">${roleName(r.name)}</span>`).join('')}</td>
                <td class="text-end">
                    <button class="btn btn-sm btn-outline-secondary" data-action="edit" data-id="${u.id}">✏️</button>
                    <button class="btn btn-sm btn-outline-danger" data-action="delete" data-id="${u.id}">🗑</button>
                </td>
            </tr>
        `).join('');
    }

    function renderRoleCheckboxes(selectedIds = []) {
        const container = document.getElementById('rolesContainer');
        container.innerHTML = allRoles.map(r => `
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="${r.id}"
                       id="role-${r.id}" ${selectedIds.includes(r.id) ? 'checked' : ''}/>
                <label class="form-check-label" for="role-${r.id}">${roleName(r.name)}</label>
            </div>
        `).join('');
    }

    document.getElementById('btnCreate').addEventListener('click', () => {
        editingId = null;
        document.getElementById('userModalTitle').textContent = 'Создание пользователя';
        document.getElementById('userForm').reset();
        document.getElementById('f-id').value = '';
        document.getElementById('passHint').textContent = '(обязателен при создании)';
        document.getElementById('btnSave').textContent = 'Создать';
        renderRoleCheckboxes([]);
        userModal.show();
    });

    document.getElementById('usersTbody').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;

        const id = Number(btn.dataset.id);
        const user = users.find(u => u.id === id);
        if (!user) return;

        if (btn.dataset.action === 'edit') {
            editingId = id;
            document.getElementById('userModalTitle').textContent = 'Редактирование пользователя';
            document.getElementById('f-id').value    = user.id;
            document.getElementById('f-name').value  = user.name ?? '';
            document.getElementById('f-middle').value= user.middleName ?? '';
            document.getElementById('f-sur').value   = user.surName ?? '';
            document.getElementById('f-mail').value  = user.mail;
            document.getElementById('f-pass').value  = '';
            document.getElementById('passHint').textContent = '(пусто — не менять)';
            document.getElementById('btnSave').textContent = 'Обновить';
            renderRoleCheckboxes(user.roles.map(r => r.id));
            userModal.show();
        }

        if (btn.dataset.action === 'delete') {
            deletingId = id;
            document.getElementById('d-id-cell').textContent     = user.id;
            document.getElementById('d-name-cell').textContent   = user.name ?? '—';
            document.getElementById('d-middle-cell').textContent = user.middleName ?? '—';
            document.getElementById('d-sur-cell').textContent    = user.surName ?? '—';
            document.getElementById('d-mail-cell').textContent   = user.mail;
            document.getElementById('d-roles-cell').textContent  = user.roles.map(r => roleName(r.name)).join(', ') || '—';
            deleteModal.show();
        }
    });

    document.getElementById('userForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMessage();

        const roleIds = Array.from(document.querySelectorAll('#rolesContainer input:checked'))
            .map(cb => Number(cb.value));

        const payload = {
            name:       document.getElementById('f-name').value.trim(),
            middleName: document.getElementById('f-middle').value.trim(),
            surName:    document.getElementById('f-sur').value.trim(),
            mail:       document.getElementById('f-mail').value.trim(),
            password:   document.getElementById('f-pass').value,
            roleIds:    roleIds
        };

        try {
            let res;
            if (editingId === null) {
                res = await fetch('/admin/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } else {
                res = await fetch(`/admin/api/users/${editingId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            }

            if (!res.ok) {
                const text = await res.text();
                throw new Error(`HTTP ${res.status}: ${text || res.statusText}`);
            }

            userModal.hide();
            await loadUsers();
            showMessage('Сохранено', 'success');
            setTimeout(clearMessage, 2000);
        } catch (err) {
            showMessage('Ошибка сохранения: ' + err.message);
        }
    });

    document.getElementById('btnConfirmDelete').addEventListener('click', async () => {
        clearMessage();
        try {
            const res = await fetch(`/admin/api/users/${deletingId}`, { method: 'DELETE' });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);

            deleteModal.hide();
            await loadUsers();
            showMessage('Пользователь удалён', 'success');
            setTimeout(clearMessage, 2000);
        } catch (err) {
            showMessage('Ошибка удаления: ' + err.message);
        }
    });

    (async function init() {
        try {
            await loadRoles();
            await loadUsers();
        } catch (err) {
            showMessage('Ошибка загрузки: ' + err.message);
        }
    })();
</script>
</body>
</html>
