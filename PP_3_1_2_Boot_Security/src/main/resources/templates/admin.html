<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Админ-панель</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        .admin-layout { min-height: 100vh; }
    </style>
</head>
<body class="bg-light">

<div class="container-fluid py-3 admin-layout">
    <div class="row g-3 h-100">

        <aside class="col-md-3 col-lg-2 d-flex">
            <div class="card shadow-sm w-100 d-flex flex-column">
                <div class="list-group list-group-flush flex-grow-1" id="roleFilter">
                    <button type="button"
                            class="list-group-item list-group-item-action active"
                            data-role-filter="ALL">
                        Admin
                    </button>
                    <button type="button"
                            class="list-group-item list-group-item-action"
                            data-role-filter="ROLE_USER">
                        User
                    </button>
                </div>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10">

            <div th:replace="logout :: logoutBar"></div>

            <h1 class="h3 mb-3">Админ-панель</h1>

            <ul class="nav nav-tabs" id="adminTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="list-tab" data-bs-toggle="tab"
                            data-bs-target="#list-pane" type="button" role="tab">
                        Пользователи
                    </button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="create-tab" data-bs-toggle="tab"
                            data-bs-target="#create-pane" type="button" role="tab">
                        Создать пользователя
                    </button>
                </li>
            </ul>

            <div class="tab-content bg-white p-3 border border-top-0 rounded-bottom shadow-sm" id="adminTabsContent">

                <div class="tab-pane fade show active" id="list-pane" role="tabpanel">
                    <table class="table table-hover table-striped align-middle mb-0" id="usersTable">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Отчество</th>
                            <th>Фамилия</th>
                            <th>Email</th>
                            <th>Роли</th>
                            <th class="text-end">Действия</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="u : ${users}"
                            th:attr="data-roles=${#strings.listJoin(u.roles.![name], ',')}">
                            <td th:text="${u.id}">1</td>
                            <td th:text="${u.name}">Иван</td>
                            <td th:text="${u.middleName}">Иванович</td>
                            <td th:text="${u.surName}">Иванов</td>
                            <td th:text="${u.mail}">ivan@mail.ru</td>
                            <td>
                                <span class="badge bg-info text-dark me-1"
                                      th:each="r : ${u.roles}"
                                      th:text="${#strings.replace(r.name, 'ROLE_', '')}">USER</span>
                            </td>
                            <td class="text-end">
                                <button type="button"
                                        class="btn btn-sm btn-outline-secondary btn-edit"
                                        data-bs-toggle="modal" data-bs-target="#editModal"
                                        th:attr="data-id=${u.id},
                                                 data-name=${u.name},
                                                 data-middle=${u.middleName},
                                                 data-sur=${u.surName},
                                                 data-mail=${u.mail},
                                                 data-roles=${#strings.listJoin(u.roles.![id], ',')}">
                                    ✏️
                                </button>
                                <button type="button"
                                        class="btn btn-sm btn-outline-danger btn-delete"
                                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                                        th:attr="data-id=${u.id}, data-name=${u.mail}">
                                    🗑
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="7" class="text-center text-muted py-4">Пользователей пока нет</td>
                        </tr>
                        <tr id="emptyFilterRow" style="display:none;">
                            <td colspan="7" class="text-center text-muted py-4">
                                Нет пользователей с выбранной ролью
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="tab-pane fade" id="create-pane" role="tabpanel">
                    <form th:action="@{/admin/create}" method="post" style="max-width: 640px;">
                        <div class="mb-3">
                            <label for="c-name" class="form-label">Имя</label>
                            <input type="text" class="form-control" id="c-name" name="name" required/>
                        </div>
                        <div class="mb-3">
                            <label for="c-middle" class="form-label">Отчество</label>
                            <input type="text" class="form-control" id="c-middle" name="middleName"/>
                        </div>
                        <div class="mb-3">
                            <label for="c-sur" class="form-label">Фамилия</label>
                            <input type="text" class="form-control" id="c-sur" name="surName"/>
                        </div>
                        <div class="mb-3">
                            <label for="c-mail" class="form-label">Email</label>
                            <input type="email" class="form-control" id="c-mail" name="mail" required/>
                        </div>
                        <div class="mb-3">
                            <label for="c-pass" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="c-pass" name="password" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label d-block">Роли</label>
                            <div class="form-check form-check-inline" th:each="r : ${allRoles}">
                                <input class="form-check-input" type="checkbox"
                                       name="roles" th:id="'c-role-' + ${r.id}" th:value="${r.id}"/>
                                <label class="form-check-label" th:for="'c-role-' + ${r.id}"
                                       th:text="${#strings.replace(r.name, 'ROLE_', '')}">USER</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </form>
                </div>

            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form th:action="@{/admin/update}" method="post" id="editForm">
                <div class="modal-header">
                    <h5 class="modal-title">Редактирование пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="e-id"/>
                    <div class="mb-3">
                        <label for="e-name" class="form-label">Имя</label>
                        <input type="text" class="form-control" id="e-name" name="name" required/>
                    </div>
                    <div class="mb-3">
                        <label for="e-middle" class="form-label">Отчество</label>
                        <input type="text" class="form-control" id="e-middle" name="middleName"/>
                    </div>
                    <div class="mb-3">
                        <label for="e-sur" class="form-label">Фамилия</label>
                        <input type="text" class="form-control" id="e-sur" name="surName"/>
                    </div>
                    <div class="mb-3">
                        <label for="e-mail" class="form-label">Email</label>
                        <input type="email" class="form-control" id="e-mail" name="mail" required/>
                    </div>
                    <div class="mb-3">
                        <label for="e-pass" class="form-label">Новый пароль (пусто — не менять)</label>
                        <input type="password" class="form-control" id="e-pass" name="password"/>
                    </div>
                    <div class="mb-3">
                        <label class="form-label d-block">Роли</label>
                        <div class="form-check form-check-inline" th:each="r : ${allRoles}">
                            <input class="form-check-input e-role" type="checkbox"
                                   name="roles" th:id="'e-role-' + ${r.id}" th:value="${r.id}"/>
                            <label class="form-check-label" th:for="'e-role-' + ${r.id}"
                                   th:text="${#strings.replace(r.name, 'ROLE_', '')}">USER</label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-primary">Обновить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form th:action="@{/admin/delete}" method="post" id="deleteForm">
                <div class="modal-header">
                    <h5 class="modal-title">Удаление пользователя</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="d-id"/>
                    <p>Удалить пользователя <strong id="d-name"></strong>?</p>
                    <p class="text-muted small mb-0">Действие необратимо.</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-danger">Удалить</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.querySelectorAll('.btn-edit').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('e-id').value     = btn.dataset.id;
            document.getElementById('e-name').value   = btn.dataset.name;
            document.getElementById('e-middle').value = btn.dataset.middle;
            document.getElementById('e-sur').value    = btn.dataset.sur;
            document.getElementById('e-mail').value   = btn.dataset.mail;

            var roleIds = (btn.dataset.roles || '').split(',').filter(Boolean);
            document.querySelectorAll('.e-role').forEach(function (cb) {
                cb.checked = roleIds.includes(cb.value);
            });
        });
    });

    document.querySelectorAll('.btn-delete').forEach(function (btn) {
        btn.addEventListener('click', function () {
            document.getElementById('d-id').value = btn.dataset.id;
            document.getElementById('d-name').textContent = btn.dataset.name;
        });
    });

    var filterButtons = document.querySelectorAll('#roleFilter [data-role-filter]');
    var rows          = document.querySelectorAll('#usersTable tbody tr[data-roles]');
    var emptyRow      = document.getElementById('emptyFilterRow');

    function applyFilter(role) {
        var visible = 0;
        rows.forEach(function (row) {
            var roleList = (row.dataset.roles || '').split(',');
            var show = (role === 'ALL') || roleList.includes(role);
            row.style.display = show ? '' : 'none';
            if (show) visible++;
        });
        emptyRow.style.display = visible === 0 ? '' : 'none';
    }

    filterButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
            filterButtons.forEach(function (b) { b.classList.remove('active'); });
            btn.classList.add('active');
            applyFilter(btn.dataset.roleFilter);
        });
    });

    applyFilter('ALL');
</script>
</body>
</html>
