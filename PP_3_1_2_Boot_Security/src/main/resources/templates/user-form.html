<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Создание пользователя</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4" style="max-width: 640px;">

    <div th:replace="logout :: logoutBar"></div>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <h1 class="h4 mb-4 text-center">Создание нового пользователя</h1>

            <form th:action="@{/admin/create}" method="post">

                <div class="mb-3">
                    <label for="name" class="form-label">Имя</label>
                    <input type="text" class="form-control" id="name" name="name"
                           placeholder="Введите имя" required/>
                </div>

                <div class="mb-3">
                    <label for="middleName" class="form-label">Отчество</label>
                    <input type="text" class="form-control" id="middleName" name="middleName"
                           placeholder="Введите отчество"/>
                </div>

                <div class="mb-3">
                    <label for="surName" class="form-label">Фамилия</label>
                    <input type="text" class="form-control" id="surName" name="surName"
                           placeholder="Введите фамилию"/>
                </div>

                <div class="mb-3">
                    <label for="mail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="mail" name="mail"
                           placeholder="name@domain.com" required/>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Введите пароль" required/>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Роли</label>
                    <div class="form-check form-check-inline" th:each="r : ${allRoles}">
                        <input class="form-check-input" type="checkbox"
                               name="roles" th:id="'role-' + ${r.id}" th:value="${r.id}"/>
                        <label class="form-check-label" th:for="'role-' + ${r.id}"
                               th:text="${r.name}">ROLE_USER</label>
                    </div>
                    <div th:if="${allRoles == null}" class="text-muted small">
                        (список ролей не передан — проверьте контроллер)
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-2 mt-4">
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                    <a th:href="@{/admin}" class="btn btn-outline-secondary">Отмена</a>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
