<!DOCTYPE html>
<html xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      xmlns:th="http://www.thymeleaf.org">
<body>
<div class="logout-bar" th:fragment="logoutBar">
    <span>
        Вы вошли как: <strong sec:authentication="name"></strong>
        <span> | Роли: </span>
        <strong th:each="auth, stat : ${#authentication.authorities}">
            <span th:text="${auth.authority}">ROLE_USER</span><span th:if="${!stat.last}">, </span>
        </strong>
    </span>
    <form method="post" style="display:inline" th:action="@{/logout}">
        <button class="logout-btn" type="submit">Выйти</button>
    </form>
</div>
</body>
</html>
