<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Домашняя страница</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(0deg, #ffa500 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 400px;
        }
        h1 { color: #333; margin-bottom: 30px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; color: #333; font-weight: 600; }
        input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        input:focus { outline: none; border-color: #667eea; }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }
        .btn:hover { background: #5566d6; }
        .error { color: #dc3545; text-align: center; margin-bottom: 15px; }
        .logout { color: #28a745; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Добро пожаловать!</h1>
    <p class="info">Вы вошли как: <strong th:text="${username}">user@example.com</strong></p>
    <p class="info">
        Ваши роли:
        <strong th:each="role, stat : ${roles}">
            <span th:text="${role.authority}">ROLE_USER</span><span th:if="${!stat.last}">, </span>
        </strong>
    </p>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn">Выйти</button>
    </form>
</div>
</body>
</html>
