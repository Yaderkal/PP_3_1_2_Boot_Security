<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Домашняя страница</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body { height: 100%; }
        .admin-layout { min-height: 100vh; }
    </style>
</head>
<body class="bg-light">

<div th:replace="logout :: logoutBar"></div>

<div class="container-fluid py-3 admin-layout">
    <div class="row g-3 h-100">

        <aside class="col-md-3 col-lg-2 d-flex">
            <div class="card shadow-sm w-100 d-flex flex-column">
                <div class="list-group list-group-flush flex-grow-1">
                    <a th:href="@{/admin}" class="list-group-item list-group-item-action">
                        Admin
                    </a>
                    <a th:href="@{/user}" class="list-group-item list-group-item-action active">
                        User
                    </a>
                </div>
            </div>
        </aside>

        <main class="col-md-9 col-lg-10">

            <h1 class="h3 mb-3">Домашняя страница</h1>

            <ul class="nav nav-tabs" id="userTabs" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="profile-tab" data-bs-toggle="tab"
                            data-bs-target="#profile-pane" type="button" role="tab">
                        Мой профиль
                    </button>
                </li>
            </ul>

            <div class="tab-content bg-white p-3 border border-top-0 rounded-bottom shadow-sm" id="userTabsContent">

                <div class="tab-pane fade show active" id="profile-pane" role="tabpanel">

                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-primary">
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Отчество</th>
                            <th>Фамилия</th>
                            <th>Email</th>
                            <th>Роли</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr>
                            <td th:text="${user.id}">1</td>
                            <td th:text="${user.name}">Иван</td>
                            <td th:text="${user.middleName}">Иванович</td>
                            <td th:text="${user.surName}">Иванов</td>
                            <td th:text="${user.mail}">ivan@mail.ru</td>
                            <td>
                                <span class="badge bg-info text-dark me-1"
                                      th:each="r : ${user.roles}"
                                      th:text="${#strings.replace(r.name, 'ROLE_', '')}">USER</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
